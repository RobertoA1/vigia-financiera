name: Verify academic MVP
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: vigia
          POSTGRES_PASSWORD: ci-only-not-a-deployment-secret
          POSTGRES_DB: vigia_tests
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U vigia -d vigia_tests"
          --health-interval=5s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements.lock
      - name: Backend on real PostgreSQL
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg://vigia:ci-only-not-a-deployment-secret@localhost:5432/vigia_tests
        run: python -m pytest -q
      - name: Apply migrations on an empty database
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://vigia:ci-only-not-a-deployment-secret@localhost:5432/vigia_tests
          JWT_SECRET: ci-only-signing-value-more-than-thirty-two-characters
          FIELD_ENCRYPTION_KEY: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
        run: |
          alembic upgrade head
          alembic check
      - run: npm ci
        working-directory: frontend
      - run: npm test && npm run build
        working-directory: frontend
      - run: node --test extension/tests/*.test.js
      - name: Compose schema validation
        run: |
          python scripts/init_env.py
          docker compose config --quiet
      # No provider keys, real SMTP credentials or deployment token in this CI.
